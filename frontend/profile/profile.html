<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Talaba Profil | X-Maktab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4361ee;
      --secondary: #3a0ca3;
      --accent: #7209b7;
      --success: #4cc9f0;
      --light: #f8f9fa;
      --dark: #212529;
    }
    
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      min-height: 100vh;
    }
    
    .glass-effect {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
    }
    
    .gradient-bg {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 50%, var(--accent) 100%);
    }
    
    .card-hover {
      transition: all 0.3s ease;
      border-radius: 16px;
      overflow: hidden;
    }
    
    .card-hover:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 25px -5px rgba(67, 97, 238, 0.25);
    }
    
    .smooth-transition {
      transition: all 0.3s ease;
    }
    
    .floating-btn {
      box-shadow: 0 10px 25px -5px rgba(67, 97, 238, 0.5);
    }
    
    .text-gradient {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>
<body class="min-h-screen py-8 px-4">
  <!-- Main Container -->
  <div class="max-w-4xl mx-auto glass-effect rounded-3xl shadow-xl overflow-hidden">
    <!-- Profile Header -->
    <div class="gradient-bg text-white p-8 relative">
      <!-- Navigation and Actions -->
      <div class="absolute top-6 right-6 flex items-center space-x-4">
        <div class="bg-white bg-opacity-20 rounded-full px-4 py-2 flex items-center">
          <i class="fas fa-coins text-yellow-300 mr-2"></i>
          <span class="font-bold" id="coin-count">0</span>
          <button onclick="openCoinModal()" class="ml-2 text-white opacity-80 hover:opacity-100">
            <i class="fas fa-plus-circle"></i>
          </button>
        </div>
        <button onclick="goBack()" class="bg-white bg-opacity-20 hover:bg-opacity-30 rounded-full px-4 py-2 smooth-transition flex items-center">
          <i class="fas fa-arrow-left mr-2"></i> Orqaga
        </button>
        <button id="logoutBtn" class="bg-white bg-opacity-20 hover:bg-opacity-30 rounded-full px-4 py-2 smooth-transition flex items-center">
          <i class="fas fa-sign-out-alt mr-2"></i> Chiqish
        </button>
      </div>
      
      <!-- Profile Info -->
      <div class="flex flex-col items-center mt-10">
        <div class="w-24 h-24 rounded-full bg-white bg-opacity-20 flex items-center justify-center mb-4 border-4 border-white border-opacity-30">
          <span class="text-3xl font-bold" id="avatarInitials">U</span>
        </div>
        <h1 class="text-3xl font-bold text-center">
          <span id="fullName">Ism Familiya</span>
        </h1>
        <p class="text-white text-opacity-80 mt-2" id="roleDisplay">Talaba</p>
        <p class="text-white text-opacity-80 mt-1 text-sm" id="profileOwnerNote"></p>
      </div>
    </div>

    <!-- Profile Content -->
    <div class="p-8">
      <!-- Action Buttons (only show for own profile) -->
      <div id="actionButtons" class="flex justify-center space-x-4 mb-8 hidden">
        <button id="editBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-full smooth-transition flex items-center">
          <i class="fas fa-edit mr-2"></i> Profilni tahrirlash
        </button>
      </div>

      <!-- Xabar yuborish tugmasi (barcha profillarda ko'rinadi) -->
      <div class="flex justify-center mb-8">
        <button id="openChatBtn" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-full smooth-transition flex items-center">
          <i class="fas fa-comment mr-2"></i> Xabar yuborish
        </button>
      </div>

      <!-- Profile Information -->
      <div class="grid md:grid-cols-2 gap-6 mb-8">
        <div class="bg-white bg-opacity-50 rounded-2xl p-6 card-hover">
          <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
            <i class="fas fa-user-circle mr-2 text-indigo-600"></i> Shaxsiy ma'lumotlar
          </h2>
          <div class="space-y-4">
            <div>
              <p class="text-sm text-gray-500">Ism</p>
              <p id="name" class="text-lg font-medium text-gray-800"></p>
            </div>
            <div>
              <p class="text-sm text-gray-500">Familiya</p>
              <p id="surname" class="text-lg font-medium text-gray-800"></p>
            </div>
            <div>
              <p class="text-sm text-gray-500">Email</p>
              <p id="email" class="text-lg font-medium text-gray-800"></p>
            </div>
          </div>
        </div>

        <div class="bg-white bg-opacity-50 rounded-2xl p-6 card-hover">
          <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
            <i class="fas fa-graduation-cap mr-2 text-indigo-600"></i> Ta'lim ma'lumotlari
          </h2>
          <div class="space-y-4">
            <div>
              <p class="text-sm text-gray-500">Maktab</p>
              <p id="school" class="text-lg font-medium text-gray-800"></p>
            </div>
            <div>
              <p class="text-sm text-gray-500">Rol</p>
              <p id="role" class="text-lg font-medium text-gray-800"></p>
            </div>
            <div>
              <p class="text-sm text-gray-500">Foydalanuvchi ID</p>
              <p id="userId" class="text-lg font-medium text-gray-800"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Bio Section -->
      <div class="bg-white bg-opacity-50 rounded-2xl p-6 card-hover">
        <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
          <i class="fas fa-info-circle mr-2 text-indigo-600"></i> Bio
        </h2>
        <p id="bio" class="text-gray-800"></p>
      </div>
    </div>
  </div>

  <!-- Chat Modal -->
  <div id="chatModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
    <div class="glass-effect rounded-2xl w-full max-w-md overflow-hidden">
      <div class="gradient-bg text-white p-4 flex justify-between items-center">
        <h2 class="text-lg font-bold" id="chatModalTitle">Shaxsiy xabarlar</h2>
        <button id="closeChatBtn" class="text-white">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <div id="chatBox" class="h-64 overflow-y-auto p-4 bg-white bg-opacity-50 space-y-3"></div>

      <div class="p-4 border-t border-gray-200">
        <input type="text" id="messageInput" placeholder="Xabar yozing..." class="border border-gray-300 rounded-xl px-4 py-3 w-full mb-2 focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
        <div class="flex items-center">
          <label for="fileInput" class="cursor-pointer text-gray-600 hover:text-indigo-600 p-2">
            <i class="fas fa-paperclip"></i>
            <input type="file" id="fileInput" class="hidden" />
          </label>
          <button onclick="sendMessage()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-xl smooth-transition">
            <i class="fas fa-paper-plane mr-2"></i> Yuborish
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Initialize with current user data
    const currentUser = JSON.parse(localStorage.getItem("user"));
    if (!currentUser) {
      window.location.href = "/frontend/login/student-login.html";
    }

    // Get user ID from URL parameters or use current user ID
    const urlParams = new URLSearchParams(window.location.search);
    const viewedUserId = urlParams.get('user') || currentUser.id;
    let targetUserId = viewedUserId;
    let isOwnProfile = viewedUserId === currentUser.id;

    // DOM Elements
    const chatModal = document.getElementById('chatModal');
    const openChatBtn = document.getElementById('openChatBtn');
    const closeChatBtn = document.getElementById('closeChatBtn');
    const chatModalTitle = document.getElementById('chatModalTitle');
    const actionButtons = document.getElementById('actionButtons');
    const profileOwnerNote = document.getElementById('profileOwnerNote');
    
    // Load user data based on ID
    function loadUserData(userId) {
      // In a real app, you would fetch user data from your backend API
      // For now, we'll simulate fetching user data
      fetch(`https://school-b97p.onrender.com/api/users/${userId}`)
        .then(response => {
          if (!response.ok) {
            throw new Error('Foydalanuvchi topilmadi');
          }
          return response.json();
        })
        .then(user => {
          displayUserData(user);
        })
        .catch(error => {
          console.error('Xatolik:', error);
          // Fallback to current user data if the requested user is not found
          if (userId !== currentUser.id) {
            loadUserData(currentUser.id);
          }
        });
    }

    // Display user data in the UI
    function displayUserData(user) {
      document.getElementById('name').textContent = user.name || 'Noma\'lum';
      document.getElementById('surname').textContent = user.surname || 'Noma\'lum';
      document.getElementById('school').textContent = user.school || 'Noma\'lum';
      document.getElementById('role').textContent = user.role || 'Noma\'lum';
      document.getElementById('email').textContent = user.email || 'Noma\'lum';
      document.getElementById('bio').textContent = user.bio || 'Bio mavjud emas';
      document.getElementById('fullName').textContent = `${user.name || ''} ${user.surname || ''}`;
      document.getElementById('roleDisplay').textContent = user.role || 'Foydalanuvchi';
      document.getElementById('userId').textContent = user.id || 'Noma\'lum';
      
      // Set avatar initials
      const initials = (user.name ? user.name.charAt(0) : '') + (user.surname ? user.surname.charAt(0) : '');
      document.getElementById('avatarInitials').textContent = initials || 'U';
      
      // Set coin count if available
      if (user.coin !== undefined) {
        document.getElementById('coin-count').textContent = user.coin;
      }
      
      // Show/hide action buttons based on profile ownership
      if (isOwnProfile) {
        actionButtons.classList.remove('hidden');
        profileOwnerNote.textContent = 'Bu sizning profilingiz';
        // O'z profilida xabar yuborish tugmasini yashirish
        document.getElementById('openChatBtn').classList.add('hidden');
      } else {
        actionButtons.classList.add('hidden');
        profileOwnerNote.textContent = 'Boshqa foydalanuvchi profili';
        // Boshqa foydalanuvchi profilida xabar yuborish tugmasini ko'rsatish
        document.getElementById('openChatBtn').classList.remove('hidden');
        // Modal sarlavhasini yangilash
        chatModalTitle.textContent = `${user.name || 'Foydalanuvchi'} ga xabar yuborish`;
      }
    }

    // Event listeners
    document.getElementById('openChatBtn').addEventListener('click', () => {
      chatModal.classList.remove('hidden');
      // Chat xabarlarini yuklash
      loadChatMessages();
    });

    document.getElementById('closeChatBtn').addEventListener('click', () => {
      chatModal.classList.add('hidden');
    });

    chatModal.addEventListener('click', (e) => {
      if (e.target === chatModal) chatModal.classList.add('hidden');
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('user');
      window.location.href = '../login/student-login.html';
    });

    // Initialize Socket.io
    const socket = io('https://school-b97p.onrender.com');
    socket.emit('register', currentUser.id);

    function sendMessage() {
      const file = document.getElementById('fileInput').files[0];
      const text = document.getElementById('messageInput').value;

      if (file) {
        const formData = new FormData();
        formData.append('file', file);

        fetch('https://school-b97p.onrender.com/api/chat/upload', {
          method: 'POST',
          body: formData
        })
        .then(res => res.json())
        .then(data => {
          socket.emit('privateMessage', {
            from: currentUser.id,
            to: targetUserId,
            content: data.url,
            type: file.type.startsWith('audio') ? 'audio' :
                  file.type.startsWith('video') ? 'video' :
                  file.type.startsWith('image') ? 'image' : 'file'
          });
        });
      } else if (text.trim()) {
        socket.emit('privateMessage', {
          from: currentUser.id,
          to: targetUserId,
          content: text,
          type: 'text'
        });
        document.getElementById('messageInput').value = '';
      }
    }

    // Chat xabarlarini yuklash
    function loadChatMessages() {
      // Bu yerda serverdan oldingi xabarlarni yuklash kodi bo'ladi
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '<p class="text-center text-gray-500">Xabarlar yuklanmoqda...</p>';
      
      // Simulyatsiya: keyinchalik serverdan haqiqiy xabarlarni yuklaysiz
      setTimeout(() => {
        chatBox.innerHTML = '<p class="text-center text-gray-500">Hozircha xabarlar mavjud emas</p>';
      }, 1000);
    }

    socket.on('message', (msg) => {
      const chatBox = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.classList.add("p-3", "rounded-xl", "max-w-xs", "bg-white", "shadow-sm");

      if (msg.type === 'text') {
        div.textContent = msg.content;
      } else if (msg.type === 'image') {
        div.innerHTML = `<img src="${msg.content}" class="w-full rounded-lg" />`;
      } else if (msg.type === 'audio') {
        div.innerHTML = `<audio controls src="${msg.content}" class="w-full"></audio>`;
      } else if (msg.type === 'video') {
        div.innerHTML = `<video controls class="w-full rounded-lg" src="${msg.content}"></video>`;
      } else {
        div.innerHTML = `<a href="${msg.content}" download class="text-indigo-600 hover:underline">📎 Faylni yuklab olish</a>`;
      }

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    // Load user data on page load
    document.addEventListener('DOMContentLoaded', () => {
      loadUserData(viewedUserId);
    });
  </script>
</body>
</html>
